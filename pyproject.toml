[project]
name = "omo"
version = "1.0.0"
description = "OMO — OS for AI Agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx[socks]>=0.28.1",
    "gitpython>=3.1.0",  # ADR-0412 归并: omo-debt engine 依赖
    "aetherforge-gateway",
    "aetherforge",
    "agora",
    "bus-foundation",
    "ecos",
    "openai>=2.41.1",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "fastmcp>=3.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[project.scripts]
omo = "omo.cli:main"
omo-debt = "omo.omo_debt:main"
c2g = "omo._vendored.c2g.cli:main"
c2g-mcp = "omo._vendored.c2g.mcp_server:mcp"
omo-mcp = "omo.mcp_server:main"
cards = "omo.omo_cards:main"
omo-sse-daemon = "omo.omo_sse_daemon:main"

[build-system]
requires = [
    "uv_build>=0.11.19,<0.12.0",
]
build-backend = "uv_build"

[tool.uv.sources.aetherforge]
path = "../aetherforge"
editable = true

[tool.uv.sources.agora]
path = "../agora"
editable = true

[tool.uv.sources.bus-foundation]
path = "../bus-foundation"

[tool.uv.sources.ecos]
path = "../ecos"

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "fast: 快速验证 (<10ms), 不依赖 agora/venv",
    "bos_40: 40 BOS URI smoke test 全套 (跨进程派发)",
    "bos_5domain: 5 Domain 覆盖验证 (POC_SERVICES 每个域至少 1 resolved)",
    "bos_concurrent: 并发 4 URI 调用测试",
    "integration: 需要外部服务 (agora/kairon) 真活的集成测试",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "S",
    "PLE",
    "RUF100",
]
ignore = [
    "S101",
    "S603",
    "S607",
    "S108",
    "S110",
    "S112",
    "S310",
    "S314",
    "S608",
    "S602",
    "S103",
    "S324",
    "E402",
    "E501",
    "SIM115",
    "N813",
    "UP047",
    "F401",
    "F841",
    "N806",
    "W291",
    "UP035",
    "UP042",
    "E731",
    "RUF100",
]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
