# resident-routes — 规则级订阅路由表 (WP-C)
# schema: resident-routes/v1
# 每个规则: event_type(必) + condition(可选, 受限表达式) + action(handler 名) + safe(批准门) + topic
# daemon 启动加载; 无匹配事件 → placeholder(仅记录)
schema_version: resident-routes/v1
routes:
  - event_type: WorkflowClosed
    topic: mesh:workflow:closed
    action: knowledge_sediment
    safe: true
  - event_type: WorkflowSucceeded
    topic: mesh:workflow:closed
    action: knowledge_sediment
    safe: true
  # 个人文件信号 (personal-signals 渠道, M3.1) → 知识沉淀
  - event_type: PersonalSignal
    topic: mesh:personal:signal
    action: knowledge_sediment
    safe: true
  # 感知文件夹信号 (perception-inbox 渠道, T10-15) → 知识沉淀
  - event_type: InboxSignal
    topic: mesh:perception:inbox
    action: knowledge_sediment
    safe: true
  # 数字大脑管线 supervisor (BET-Y1Q4-T2-05): 定时晨报 + OCR 入站编排,
  # execute 角色 — 产物全部落盘不外发, 告警进 convergence-pulse health
  - event_type: PipelineTick
    topic: mesh:pipeline:tick
    action: pipeline_supervisor
    safe: true
  - event_type: PipelineInbound
    topic: mesh:pipeline:inbound
    action: pipeline_supervisor
    safe: true
  # workflow 生命周期事件 (T10-12 消费端补全) → 知识沉淀 (safe, 只写知识草稿)
  - event_type: WorkflowRequested
    topic: mesh:workflow:requested
    action: knowledge_sediment
    safe: true
  - event_type: WorkflowAdmitted
    topic: mesh:workflow:started
    action: knowledge_sediment
    safe: true
  - event_type: StepStarted
    topic: mesh:step:started
    action: knowledge_sediment
    safe: true
  - event_type: StepDispatched
    topic: mesh:workflow:started
    action: knowledge_sediment
    safe: true
  - event_type: EvidenceRecorded
    topic: mesh:workflow:evidence
    action: knowledge_sediment
    safe: true
  - event_type: WorkflowFailed
    topic: mesh:workflow:failed
    action: knowledge_sediment
    safe: true
  - event_type: StepFailed
    topic: mesh:step:failed
    action: knowledge_sediment
    safe: true
  - event_type: StepTimeout
    topic: mesh:step:failed
    action: knowledge_sediment
    safe: true
  # 决策/执行 agent 规则(收尾验证激活)
  - event_type: WorkflowFailed
    topic: mesh:workflow:failed
    action: decision_agent
    safe: true
  - event_type: StepFailed
    topic: mesh:step:failed
    action: decision_agent
    safe: true
  - event_type: StepTimeout
    topic: mesh:step:failed
    action: decision_agent
    safe: true
  - event_type: ExecutionRequested
    topic: mesh:workflow:execution
    action: execution_agent
    safe: false
  - event_type: WorkPacketDispatched
    topic: mesh:workflow:execution
    action: execution_agent
    safe: false
  # monitor 角色: observability 严重事件 → 告警 (T10-16)
  - event_type: alert
    topic: mesh:observability:alert
    action: alert
    safe: true
  # heartbeat 角色: 活性心跳事件 → 台账 (T10-16)
  - event_type: system.alive
    topic: mesh:system:alive
    action: heartbeat
    safe: true

  # ── Harness 7 探针 Event Bus 接线 (harness-policy.yaml § probes) ──────
  - event_type: arch_upgrade
    topic: mesh:observability:arch
    action: knowledge_sediment
    safe: true
  - event_type: feature_add
    topic: mesh:workflow:step
    action: knowledge_sediment
    safe: true
  - event_type: bug_fix
    topic: mesh:workflow:failed
    action: knowledge_sediment
    safe: true
  - event_type: experience
    topic: mesh:personal:signal
    action: knowledge_sediment
    safe: true
  - event_type: doc_governance
    topic: mesh:workflow:doc
    action: knowledge_sediment
    safe: true
  - event_type: toolchain
    topic: mesh:system:health
    action: knowledge_sediment
    safe: true
  - event_type: business_process
    topic: mesh:pipeline:episode
    action: knowledge_sediment
    safe: true
